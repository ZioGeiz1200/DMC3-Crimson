name: build-zh

on:
  workflow_dispatch:
  push:
    branches: [ main, zh ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fonttools
        run: pip install fonttools

      - name: Generate CJK font header
        shell: pwsh
        run: |
          if (-not (Test-Path "tools/font.ttf")) {
            Write-Error "缺少 tools/font.ttf。请放一个 glyf 轮廓的中文 TTF（如思源黑体 TTF 版、LXGW WenKai、HarmonyOS Sans SC、阿里巴巴普惠体）。"
            exit 1
          }
          python tools/gen_cjk_font.py --font tools/font.ttf --chars tools/used_chars.txt --out src/Fonts/CJKSubset.hpp

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crimson-zh
          if-no-files-found: error
          path: |
            build/**/Crimson.dll
            build/**/Crimson.pdb
